<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Net-Zero Home Race</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow-x:hidden;background:#6B9C5E}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(59,47,47,.2);border-radius:4px}
@keyframes diceRoll{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-25deg) scale(1.2)}50%{transform:rotate(20deg) scale(1.15)}75%{transform:rotate(-10deg) scale(1.1)}100%{transform:rotate(0) scale(1)}}
@keyframes diceBounce{0%{transform:scale(0.5) rotate(180deg);opacity:0}50%{transform:scale(1.3) rotate(0);opacity:1}70%{transform:scale(0.9)}100%{transform:scale(1)}}
@keyframes playerHop{0%{transform:translate(-50%,-50%) scale(1)}30%{transform:translate(-50%,-100%) scale(1.1)}60%{transform:translate(-50%,-50%) scale(0.9)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes playerIdle{0%,100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 0 8px #D4A84380}50%{transform:translate(-50%,-55%) scale(1.05);box-shadow:0 0 20px #D4A84380}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
@keyframes cardFlipIn{0%{transform:rotateY(90deg) scale(0.8);opacity:0}50%{transform:rotateY(-10deg) scale(1.05);opacity:1}100%{transform:rotateY(0) scale(1)}}
@keyframes cardSlideUp{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes targetGlow{0%,100%{box-shadow:0 0 6px #D4A84340}50%{box-shadow:0 0 18px #D4A84380}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes epSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes epPulse{0%,100%{opacity:.6}50%{opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const EP_API_URL = "https://unrecluse-natacha-subvitreous.ngrok-free.dev";
const GOOGLE_SHEETS_URL = "";
const ONNX_MODEL_PATH = "nzhr_policy.onnx";

const SIM_YRS=20, BASE_CAP=8000, BASE_E=45349, RATE=0.12;
const LIFE={"LED Lights":29,"Elec. Water Heater":20,"A/C Tune-Up":3,"Heat Pump":15,"Wall Insul.":100,"Ceiling Insul.":100,"Radiant Barrier":25,"Cool Roof":30,"Window Replace":30,"Window Screen":20,"Ceiling Fan":11,"Washer Replace":14,"Cooktop Replace":13,"Dryer Replace":13,"Air Sealing":10,"Solar PV":25};

const DESC={"Elec. Water Heater":{title:"High-Efficiency Water Heater",desc:"Upgrade to a 98% efficient electric water heater with schedule-based control.",benefit:"Thermal eff. 0.85 → 0.98",icon:"🚿"},"Cooktop Replace":{title:"Induction Cooktop",desc:"Replace your range with an induction cooktop. Heats via magnetic field.",benefit:"Equipment power reduced 35%",icon:"🍳"},"Ceiling Fan":{title:"Energy Star Ceiling Fan",desc:"Ceiling fans improve air circulation, reducing A/C load.",benefit:"Cooling COP +5% effective",icon:"🌀"},"Window Screen":{title:"Solar Window Screens",desc:"Exterior screens block solar heat before it enters your home.",benefit:"SHGC reduced by 20%",icon:"🪟"},"Heat Pump":{title:"Heat Pump HVAC",desc:"Moves heat instead of generating it — replaces electric resistance heating.",benefit:"COP 0.9 → 4.0",icon:"♨️"},"Radiant Barrier":{title:"Attic Radiant Barrier",desc:"Reflective foil bounces radiant heat back. Keeps attic cooler.",benefit:"Roof thermal resistance +10%",icon:"🛡️"},"Dryer Replace":{title:"Heat Pump Dryer",desc:"Recycles hot air instead of venting outside.",benefit:"Equipment power reduced 50%",icon:"👕"},"Ceiling Insul.":{title:"Ceiling Insulation",desc:"Blown-in insulation in attic. The #1 place homes lose energy.",benefit:"Insulation thickness 2.5x",icon:"🏗️"},"Air Sealing":{title:"Air Sealing",desc:"Seal cracks around doors, windows, pipes to stop air leaks.",benefit:"Infiltration rate reduced 50%",icon:"💨"},"Washer Replace":{title:"Energy Star Washer",desc:"Uses less water, spins clothes drier, saves dryer energy too.",benefit:"Equipment power reduced 30%",icon:"🫧"},"A/C Tune-Up":{title:"A/C Tune-Up",desc:"Technician cleans coils, checks refrigerant, optimizes airflow.",benefit:"COP +10% improvement",icon:"🔧"},"Window Replace":{title:"Low-E Double Pane",desc:"Low-emissivity double pane blocks heat transfer while letting light in.",benefit:"U: 2.78→1.7, SHGC: 0.56→0.30",icon:"🪟"},"Solar PV":{title:"Rooftop Solar",desc:"Generate clean electricity from sunlight on your roof.",benefit:"Generates ~29,948 kWh/year",icon:"☀️"},"Cool Roof":{title:"Cool Roof Coating",desc:"Reflective coating on roof. Reflects sunlight instead of absorbing.",benefit:"Roof solar absorptance reduced",icon:"🏠"},"Wall Insul.":{title:"Wall Insulation",desc:"Add insulation inside exterior walls. Keeps heat in/out.",benefit:"Wall thickness doubled (2x)",icon:"🧱"},"LED Lights":{title:"LED Bulbs",desc:"Replace all incandescent bulbs with LEDs. 25x longer life.",benefit:"Lighting power reduced 75%",icon:"💡"}};

const B=[{p:0,t:"start",n:"START",i:"🏠",c:0,s:0},{p:1,t:"weather",n:"Coldwave",i:"❄️",c:0,s:0},{p:2,t:"retrofit",n:"Elec. Water Heater",i:"🚿",c:2100,s:1307},{p:3,t:"retrofit",n:"Cooktop Replace",i:"🍳",c:920,s:1743},{p:4,t:"retrofit",n:"Ceiling Fan",i:"🌀",c:290,s:246},{p:5,t:"ob",n:"OB Card",i:"👤",c:0,s:0},{p:6,t:"retrofit",n:"Window Screen",i:"🪟",c:1125,s:1108},{p:7,t:"retrofit",n:"Heat Pump",i:"♨️",c:3900,s:2534},{p:8,t:"retrofit",n:"Radiant Barrier",i:"🛡️",c:812,s:819},{p:9,t:"ob",n:"OB Card",i:"👤",c:0,s:0},{p:10,t:"retrofit",n:"Dryer Replace",i:"👕",c:760,s:963},{p:11,t:"retrofit",n:"Ceiling Insul.",i:"🏗️",c:6084,s:4343},{p:12,t:"start",n:"NEXT YEAR",i:"📅",c:0,s:0},{p:13,t:"retrofit",n:"Air Sealing",i:"💨",c:57,s:553},{p:14,t:"retrofit",n:"Washer Replace",i:"🫧",c:560,s:361},{p:15,t:"retrofit",n:"A/C Tune-Up",i:"🔧",c:200,s:677},{p:16,t:"retrofit",n:"Window Replace",i:"🪟",c:3914,s:1755},{p:17,t:"ob",n:"OB Card",i:"👤",c:0,s:0},{p:18,t:"retrofit",n:"Solar PV",i:"☀️",c:40984,s:29948},{p:19,t:"weather",n:"Heatwave",i:"🔥",c:0,s:0},{p:20,t:"retrofit",n:"Cool Roof",i:"🏠",c:2078,s:945},{p:21,t:"ob",n:"OB Card",i:"👤",c:0,s:0},{p:22,t:"retrofit",n:"Wall Insul.",i:"🧱",c:5076,s:3073},{p:23,t:"retrofit",n:"LED Lights",i:"💡",c:168,s:1584}];

const OB_A=[{name:"Vacation",s:1000,d:"You went on vacation — energy saved!"},{name:"New Job (WFH)",s:-800,d:"Working from home uses more energy."},{name:"Long Party",s:-390,d:"Friends visited for 10 days."},{name:"Energy Use Info",s:2880,d:"Smart display helps reduce usage!"},{name:"Electric Car",s:-3000,d:"EV charging increases electricity."}];
const OB_C={"Elec. Water Heater":{w:[{name:"Water Temp ↓",s:511,d:"Lower water heater temp."},{name:"Water Temp ↑",s:-511,d:"Higher temp."},{name:"Less Water",s:286,d:"Less water used."},{name:"More Water",s:-351,d:"More water."}],wo:[{name:"Water Temp ↓",s:783,d:"Lower temp."},{name:"Water Temp ↑",s:-783,d:"Higher temp."},{name:"Less Water",s:438,d:"Less water."},{name:"More Water",s:-538,d:"More water."}]},"LED Lights":{w:[{name:"Lights Off",s:207,d:"Lights off when leaving."},{name:"Lights On",s:-328,d:"Lights left on."}],wo:[{name:"Lights Off",s:920,d:"Reduced hours."},{name:"Lights On",s:-1456,d:"All lights on."}]},"Heat Pump":{w:[{name:"A/C Use ↓",s:1253,d:"Fewer A/C hours."},{name:"Free Cooling",s:1156,d:"Economizer mode."},{name:"Thermostat ↓",s:549,d:"Lower thermostat."}],wo:[{name:"A/C Use ↓",s:695,d:"Reduced A/C."},{name:"Free Cooling",s:596,d:"Outdoor air."},{name:"Thermostat ↓",s:295,d:"Lower thermostat."}]}};

const CL={sage:"#8DB580",sageDk:"#6B9C5E",cream:"#F5F0E8",creamDk:"#E8DCC8",brn:"#3B2F2F",brnLt:"#6B5B4B",gold:"#D4A843",goldBg:"#F2E6B5",red:"#C25450",redBg:"#EBBDB8",grn:"#4A8C3F",grnBg:"#B8D8AC",blu:"#5B8BA8",wht:"#FFF",brd:"#7BAD6E",retBg:"#5A8A50"};

const NAME_TO_RL={"Elec. Water Heater":"Electric Water Heater","Cooktop Replace":"Cooktop Replacement","Window Replace":"Window Replacement","Dryer Replace":"Dryer Replacement","Ceiling Insul.":"Ceiling Insulation","Washer Replace":"Washer Replacement","Wall Insul.":"Wall Insulation"};
const RETROFIT_NAMES=["LED Lights","Electric Water Heater","A/C Tune-Up","Heat Pump","Wall Insulation","Ceiling Insulation","Radiant Barrier","Cool Roof","Window Replacement","Window Screen","Ceiling Fan","Washer Replacement","Cooktop Replacement","Dryer Replacement","Air Sealing","Solar PV"];

let onnxSession = null; let ppoLoaded = false;
async function loadPPO(){try{onnxSession=await ort.InferenceSession.create(ONNX_MODEL_PATH);ppoLoaded=true;console.log("PPO loaded!")}catch(e){console.log("PPO not found:",e.message);ppoLoaded=false}}
loadPPO();
function buildStateVector(st,sp){const v=new Float32Array(48);v[0]=st.year/20;v[1]=(sp?sp.p:st.pos)/23;v[2]=st.capital/50000;v[3]=st.ts/50000;st.ar.forEach(function(r){const fn=NAME_TO_RL[r.name]||r.name;const idx=RETROFIT_NAMES.indexOf(fn);if(idx>=0){v[4+idx]=1;v[20+idx]=r.yr/30}});v[36]=sp&&sp.t==="retrofit"?1:0;v[37]=sp&&sp.c>0?Math.min(st.capital/sp.c,1):0;v[38]=st.ts/50000;v[39]=1;v[42]=1;return v}
async function ppoPredict(st,sp){if(!ppoLoaded||!onnxSession)return null;try{const t=new ort.Tensor('float32',buildStateVector(st,sp),[1,48]);const r=await onnxSession.run({observation:t});return{pSkip:r.action_probs.data[0],pBuy:r.action_probs.data[1],source:"ppo"}}catch(e){return null}}

async function callEPAPI(names,weather){if(!EP_API_URL)return null;try{const r=await fetch(EP_API_URL+"/simulate",{method:"POST",headers:{"Content-Type":"application/json","ngrok-skip-browser-warning":"true"},body:JSON.stringify({retrofits:names,weather:weather||"normal"})});if(!r.ok)return null;return await r.json()}catch(e){return null}}
function sendToSheets(data){if(!GOOGLE_SHEETS_URL)return;fetch(GOOGLE_SHEETS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}).catch(function(e){})}

function heuristicAI(st,sp){if(sp.t!=="retrofit")return null;const av=st.capital-st.utilBill-st.exp;if(st.ar.some(function(r){return r.name===sp.n}))return{rec:false,reason:"Already installed.",score:0,source:"heuristic"};if(av<sp.c)return{rec:false,reason:"Not enough budget.",score:0,source:"heuristic"};const yl=SIM_YRS-st.year+1,life=Math.min(LIFE[sp.n]||10,yl);const roi=(sp.s*RATE*life)/sp.c,pb=sp.c/(sp.s*RATE);let sc=Math.min(roi,5)*20+Math.min(sp.s/sp.c,3)*15+(pb<yl?20:-10);if(st.ts/BASE_E<.5)sc+=10;if(sp.c/av>.8)sc-=15;if(sp.c/av<.3)sc+=10;const rec=sc>30;const reason=rec?(roi>3?"Excellent! ROI "+roi.toFixed(1)+"x, payback "+pb.toFixed(1)+"yrs.":"Positive return over "+yl+" remaining years."):(pb>yl?"Payback ("+pb.toFixed(1)+"yrs) exceeds remaining time ("+yl+"yrs).":"Low return at this point.");return{rec:rec,reason:reason,roi:roi.toFixed(2),pb:pb.toFixed(1),score:Math.round(sc),source:"heuristic"}}

function calcPF(ar){const inv=ar.reduce(function(a,r){return a+r.cost},0);const futureVal=ar.reduce(function(a,r){return a+r.savings*RATE*r.yr},0);const earned=ar.reduce(function(a,r){return a+r.savings*RATE*Math.max(0,(LIFE[r.name]||10)-r.yr)},0);return{inv:inv,futureVal:futureVal,earned:earned,net:futureVal-inv}}
function utilB(s){return Math.max(0,BASE_E-s.ts-s.obS-s.wS)*RATE}
function drawOB(ar){const pool=[...OB_A];for(const k of Object.keys(OB_C)){const c=OB_C[k];pool.push(...(ar.some(function(r){return r.name===k})?c.w:c.wo))}return pool[Math.floor(Math.random()*pool.length)]}

const INIT={phase:"menu",year:1,pos:0,capital:BASE_CAP,ts:0,ar:[],obS:0,wS:0,exp:0,dv:null,d1:null,d2:null,rolling:false,curSp:null,curOB:null,curW:null,ai:null,hist:[],log:[],dec:[],name:"",tut:false,pid:"",sid:"",animPos:0,animTarget:0,animating:false,diceAnim:false,diceShowResult:false,cardStage:"back",selRetrofit:null,epLoading:false,epResult:null};

function doYearAdvance(st,ny,sp,lg){const upd=st.ar.map(function(r){return{...r,yr:r.yr-1}}).filter(function(r){return r.yr>0});const nts=upd.reduce(function(s,r){return s+r.savings},0);const h={year:st.year,capital:st.capital,ts:st.ts,utilBill:utilB(st),exp:st.exp,cnt:st.ar.length};if(ny>SIM_YRS)return{...st,rolling:false,pos:st.animTarget,animating:false,phase:"over",hist:[...st.hist,h],log:lg};return{...st,rolling:false,pos:st.animTarget,animating:false,year:ny,capital:BASE_CAP,exp:0,obS:0,wS:0,ts:nts,ar:upd,hist:[...st.hist,h],phase:"ep_loading",curSp:sp,log:lg}}

function red(st,a){switch(a.type){
case "START":return{...INIT,phase:"playing",name:a.name||"Player",pid:"S_"+Date.now().toString(36),sid:Date.now().toString(36),log:["🏠 Game started! Roll the dice."]};
case "TUT":return{...st,tut:!st.tut};
case "SEL_RETRO":return{...st,selRetrofit:st.selRetrofit===a.name?null:a.name};
case "ROLL":return{...st,rolling:true,dv:null,d1:null,d2:null,diceAnim:true,diceShowResult:false,selRetrofit:null};
case "DICE_SHOW":return{...st,d1:a.d1,d2:a.d2,dv:a.d1+a.d2,diceAnim:false,diceShowResult:true};
case "START_MOVE":return{...st,diceShowResult:false,animating:true,animPos:st.pos,animTarget:(st.pos+st.dv)%24};
case "ANIM_STEP":return{...st,animPos:(st.animPos+1)%24};
case "ANIM_DONE":{const d=st.dv,np=st.animTarget;let yp=0;for(let i=1;i<=d;i++){const cp=(st.pos+i)%24;if((cp===0||cp===12)&&!(i===d&&cp===np))yp++}if(np===0||np===12)yp++;const ya=yp>0;const sp=B[np];const lg=[...st.log,"🎲 "+st.d1+"+"+st.d2+"="+d+" → "+sp.n];if(ya&&st.year<SIM_YRS)return doYearAdvance(st,st.year+1,sp,[...lg,"📅 Year "+(st.year+1)+" begins!"]);if(ya&&st.year>=SIM_YRS)return doYearAdvance(st,st.year+1,sp,[...lg,"🏁 Game Over!"]);let ph="playing",ob=null,wt=null;if(sp.t==="retrofit"){if(st.ar.some(function(r){return r.name===sp.n}))lg.push("✅ "+sp.n+" — already installed.");else ph="retrofit_choice"}else if(sp.t==="ob"){ph="ob";ob=drawOB(st.ar);lg.push("👤 "+ob.name+" ("+(ob.s>0?"+":"")+ob.s.toLocaleString()+" kWh)")}else if(sp.t==="weather"){ph="weather";wt=sp.n}return{...st,rolling:false,pos:np,animating:false,phase:ph,curSp:sp,ai:null,curOB:ob,curW:wt,log:lg,cardStage:"back"}}
case "EP_DONE":return{...st,phase:"year_end",epLoading:false,epResult:a.result};
case "FLIP_CARD":return{...st,cardStage:"front"};
case "ASK_AI":{const ai2=heuristicAI({capital:st.capital,utilBill:utilB(st),exp:st.exp,year:st.year,ar:st.ar,ts:st.ts},st.curSp);return{...st,cardStage:"ai",ai:a.ppoResult?{...ai2,ppo:a.ppoResult,source:"ppo"}:ai2}}
case "BUY":{const s=st.curSp;const dec={year:st.year,pos:s.p,name:s.n,action:"buy",cost:s.c,savings:s.s,aiRec:st.ai?st.ai.rec:null,aiScore:st.ai?st.ai.score:null,aiConsulted:a.consulted||false,cardStage:st.cardStage,ts:Date.now()};return{...st,phase:"playing",exp:st.exp+s.c,ts:st.ts+s.s,ar:[...st.ar,{name:s.n,savings:s.s,cost:s.c,yr:LIFE[s.n]||10}],ai:null,curSp:null,dec:[...st.dec,dec],log:[...st.log,"🔧 "+s.n+"! -$"+s.c.toLocaleString()+" +"+(s.s/1000).toFixed(1)+"k kWh/yr"+(a.consulted?" (AI)":"")],cardStage:"back"}}
case "SKIP":{const sn=st.curSp?st.curSp.n:"";const dec2={year:st.year,pos:st.curSp?st.curSp.p:0,name:sn,action:"skip",cost:st.curSp?st.curSp.c:0,savings:st.curSp?st.curSp.s:0,aiRec:st.ai?st.ai.rec:null,aiScore:st.ai?st.ai.score:null,aiConsulted:a.consulted||false,cardStage:st.cardStage,ts:Date.now()};return{...st,phase:"playing",ai:null,curSp:null,dec:[...st.dec,dec2],log:[...st.log,"⏭️ Skip "+sn+(a.consulted?" (AI)":"")],cardStage:"back"}}
case "DOB":return{...st,phase:"playing",curOB:null,obS:st.obS+(st.curOB?st.curOB.s:0)};
case "DW":return{...st,phase:"playing",curW:null,wS:st.wS+(st.curW==="Coldwave"?-2000:-3000)};
case "DYE":{const s3=st.curSp;if(s3&&s3.t==="retrofit"&&!st.ar.some(function(r){return r.name===s3.n}))return{...st,phase:"retrofit_choice",cardStage:"back",ai:null};if(s3&&s3.t==="ob")return{...st,phase:"ob",curOB:drawOB(st.ar)};if(s3&&s3.t==="weather")return{...st,phase:"weather"};return{...st,phase:"playing"}}
case "RESET":return{...INIT,pid:st.pid,phase:"menu"};
default:return st}}

function getBoardPositions(){const top=[0,1,2,3,4,5,6],right=[7,8,9,10,11],bottom=[18,17,16,15,14,13,12],left=[23,22,21,20,19];const cw=62,ch=54,gap=3;const positions={};top.forEach(function(idx,i){positions[idx]={x:i*(cw+gap),y:0,w:cw,h:ch}});right.forEach(function(idx,i){positions[idx]={x:6*(cw+gap),y:(i+1)*(ch+gap),w:cw,h:ch}});bottom.forEach(function(idx,i){positions[idx]={x:i*(cw+gap),y:6*(ch+gap),w:cw,h:ch}});left.forEach(function(idx,i){positions[idx]={x:0,y:(i+1)*(ch+gap),w:cw,h:ch}});return{positions:positions,totalW:7*cw+6*gap,totalH:7*ch+6*gap}}

function PlayerToken({pos,positions,animating}){const p=positions[pos];if(!p)return null;return <div style={{position:"absolute",left:p.x+p.w/2,top:p.y+p.h/2,width:32,height:32,borderRadius:"50%",background:"linear-gradient(135deg,"+CL.gold+",#E8C050)",border:"3px solid "+CL.brn,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,zIndex:20,boxShadow:"0 3px 12px rgba(0,0,0,.4)",animation:animating?"playerHop 0.5s ease infinite":"playerIdle 2s ease-in-out infinite",transition:"left 0.15s, top 0.15s",transform:"translate(-50%,-50%)"}}>🧑</div>}

function RectBoard({displayPos,targetPos,ar,animating}){const layout=getBoardPositions();const positions=layout.positions;return(<div style={{background:CL.brd,borderRadius:14,padding:10,border:"3px solid "+CL.sageDk,boxShadow:"0 4px 16px rgba(0,0,0,.15)",overflowX:"auto"}}><div style={{position:"relative",width:layout.totalW,height:layout.totalH,margin:"0 auto",minWidth:layout.totalW}}><div style={{position:"absolute",left:65,top:57,width:5*62+4*3,height:5*54+4*3,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,.07)",borderRadius:10,border:"2px dashed rgba(255,255,255,.12)"}}><div style={{fontSize:28}}>🏠</div><div style={{fontSize:16,fontWeight:900,color:CL.wht,fontFamily:"Georgia,serif",textShadow:"0 2px 4px rgba(0,0,0,.3)"}}>NET-ZERO</div><div style={{fontSize:10,fontWeight:600,color:"rgba(255,255,255,.5)",fontFamily:"Georgia,serif",letterSpacing:3}}>HOME RACE</div></div>{B.map(function(space,idx){const pos=positions[idx];if(!pos)return null;const isTarget=targetPos===idx&&animating;const owned=ar.some(function(r){return r.name===space.n});const bg=space.t==="start"?"linear-gradient(145deg,"+CL.gold+",#C49A38)":space.t==="ob"?"linear-gradient(145deg,#6B9C6B,#5A8A5A)":space.t==="weather"?(space.n==="Coldwave"?"linear-gradient(145deg,#5B7D9C,#4A6C8A)":"linear-gradient(145deg,#B85042,#A04438)"):(owned?"linear-gradient(145deg,#3D6A35,#2D5A28)":"linear-gradient(145deg,"+CL.retBg+",#4D7D45)");return(<div key={idx} style={{position:"absolute",left:pos.x,top:pos.y,width:pos.w,height:pos.h,background:bg,borderRadius:6,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"2px 1px",overflow:"hidden",border:isTarget?"2.5px solid "+CL.gold:owned?"1.5px solid "+CL.goldBg:"1px solid rgba(0,0,0,0.12)",animation:isTarget?"targetGlow 1s ease-in-out infinite":"none"}}>{owned&&<div style={{position:"absolute",top:1,left:2,fontSize:8,color:CL.goldBg,fontWeight:800}}>✓</div>}<div style={ function AnimDice({diceAnim,diceShowResult,d1,d2,value,onRoll,disabled}){const faces=["⚀","⚁","⚂","⚃","⚄","⚅"];const[disp1,setDisp1]=React.useState("🎲");const[disp2,setDisp2]=React.useState("🎲");React.useEffect(function(){if(diceAnim){let c=0;const iv=setInterval(function(){setDisp1(faces[Math.floor(Math.random()*6)]);setDisp2(faces[Math.floor(Math.random()*6)]);c++;if(c>14)clearInterval(iv)},80);return function(){clearInterval(iv)}}},[diceAnim]);return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}><div style={{display:"flex",gap:6}}><button onClick={onRoll} disabled={disabled} style={{width:52,height:52,borderRadius:12,background:diceAnim?"linear-gradient(135deg,"+CL.gold+",#E8C050)":CL.cream,border:"3px solid "+CL.brn,fontSize:28,display:"flex",alignItems:"center",justifyContent:"center",cursor:disabled?"not-allowed":"pointer",opacity:disabled?.4:1,boxShadow:diceAnim?"0 0 16px "+CL.gold+"60":"0 3px 8px rgba(0,0,0,.2)",animation:diceAnim?"diceRoll 0.4s ease infinite":"none"}}>{diceAnim?disp1:d1?faces[d1-1]:"🎲"}</button><button onClick={onRoll} disabled={disabled} style={{width:52,height:52,borderRadius:12,background:diceAnim?"linear-gradient(135deg,"+CL.gold+",#E8C050)":CL.cream,border:"3px solid "+CL.brn,fontSize:28,display:"flex",alignItems:"center",justifyContent:"center",cursor:disabled?"not-allowed":"pointer",opacity:disabled?.4:1,boxShadow:diceAnim?"0 0 16px "+CL.gold+"60":"0 3px 8px rgba(0,0,0,.2)",animation:diceAnim?"diceRoll 0.35s ease infinite":"none"}}>{diceAnim?disp2:d2?faces[d2-1]:"🎲"}</button></div>{diceShowResult&&value&&(<div style={{fontSize:28,fontWeight:900,color:CL.gold,fontFamily:"Georgia,serif",animation:"diceBounce 0.5s ease",textShadow:"0 2px 8px "+CL.gold+"40"}}>{d1+" + "+d2+" = "+value}</div>)}</div>)}

function Stats({st}){const ubl=utilB(st),av=st.capital-ubl-st.exp;const pf=calcPF(st.ar);const curE=Math.max(0,BASE_E-st.ts-st.obS-st.wS);const savKwh=BASE_E-curE;const savPct=savKwh/BASE_E*100;return(<div style={{marginBottom:8}}><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4,marginBottom:4}}>{[{l:"Year",v:st.year+"/"+SIM_YRS,c:CL.gold},{l:"Budget",v:"$"+Math.max(0,av).toFixed(0),c:av>2000?CL.grn:CL.red},{l:"Bill/yr",v:"$"+ubl.toFixed(0),c:CL.red},{l:"Portfolio",v:"$"+pf.net.toFixed(0),c:pf.net>=0?CL.grn:CL.red}].map(function(item){return(<div key={item.l} style={{background:CL.cream,borderRadius:8,padding:"4px 2px",textAlign:"center",border:"1px solid "+CL.creamDk}}><div style={{fontSize:11,fontWeight:800,color:item.c,fontFamily:"Georgia,serif"}}>{item.v}</div><div style={{fontSize:6.5,color:CL.brnLt,fontWeight:600}}>{item.l}</div></div>)})}</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:4,marginBottom:4}}><div style={{background:CL.cream,borderRadius:8,padding:"4px 6px",border:"1px solid "+CL.creamDk}}><div style={{fontSize:10,fontWeight:800,color:CL.brn,fontFamily:"Georgia,serif"}}>{curE.toLocaleString()+" / "+BASE_E.toLocaleString()}</div><div style={{fontSize:6.5,color:CL.brnLt,fontWeight:600}}>Current / Initial (kWh)</div></div><div style={{background:CL.cream,borderRadius:8,padding:"4px 6px",textAlign:"center",border:"1px solid "+CL.creamDk}}><div style={{fontSize:10,fontWeight:800,color:CL.grn,fontFamily:"Georgia,serif"}}>{savKwh.toLocaleString()+" kWh"}</div><div style={{fontSize:6.5,color:CL.brnLt,fontWeight:600}}>Savings</div></div><div style={{background:CL.cream,borderRadius:8,padding:"4px 6px",textAlign:"center",border:"1px solid "+CL.creamDk}}><div style={{fontSize:10,fontWeight:800,color:savPct>50?CL.grn:savPct>20?CL.gold:CL.red,fontFamily:"Georgia,serif"}}>{savPct.toFixed(1)+"%"}</div><div style={{fontSize:6.5,color:CL.brnLt,fontWeight:600}}>Savings %</div></div></div><div style={{background:CL.cream,b function OBModal({card,onDismiss}){const pos=card.s>=0;return(<OV><Crd border={pos?CL.grn:CL.red} bg={pos?"linear-gradient(180deg,"+CL.grnBg+","+CL.cream+")":"linear-gradient(180deg,"+CL.redBg+","+CL.cream+")"}><div style={{textAlign:"center"}}><div style={{width:40,height:40,borderRadius:"50%",background:pos?CL.grn:CL.red,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 10px",fontSize:18,color:CL.wht,animation:"scaleIn .4s ease"}}>{pos?"➕":"➖"}</div><h2 style={{color:CL.brn,fontSize:18,marginBottom:6,fontFamily:"Georgia,serif"}}>{card.name}</h2><p style={{color:CL.brnLt,fontSize:12,marginBottom:12,lineHeight:1.4}}>{card.d}</p><div style={{fontSize:26,fontWeight:900,color:pos?CL.grn:CL.red,marginBottom:14,fontFamily:"Georgia,serif",animation:"diceBounce .5s ease"}}>{(pos?"+":"")+card.s.toLocaleString()+" kWh"}</div><button onClick={onDismiss} style={{padding:"10px 28px",borderRadius:8,border:"none",background:pos?CL.grn:CL.red,color:CL.wht,fontWeight:700,cursor:"pointer",fontSize:13}}>Continue</button></div></Crd></OV>)}
function WModal({type,onDismiss}){const cold=type==="Coldwave";return(<OV><Crd border={cold?"#5B7D9C":CL.red} bg={cold?"linear-gradient(180deg,#D0E0F0,#E8E0D8)":"linear-gradient(180deg,#F0C8C0,#E8E0D8)"}><div style={{textAlign:"center"}}><span style={{fontSize:52,display:"block",marginBottom:6,animation:"pulse 1s ease infinite"}}>{cold?"❄️":"🔥"}</span><h2 style={{color:CL.brn,fontSize:20,marginBottom:6,fontFamily:"Georgia,serif"}}>{cold?"Coldwave!":"Heatwave!"}</h2><p style={{color:CL.brnLt,fontSize:12,marginBottom:12}}>{cold?"Extreme cold → heating demand up.":"Extreme heat → cooling demand up."}</p><div style={{fontSize:26,fontWeight:900,color:CL.red,marginBottom:14,fontFamily:"Georgia,serif",animation:"diceBounce .5s ease"}}>{cold?"-2,000":"-3,000"}{" kWh"}</div><button onClick={onDismiss} style={{padding:"10px 28px",borderRadius:8,border:"none",background:cold?"#5B7D9C":CL.red,color:CL.wht,fontWeight:700,cursor:"pointer",fontSize:13}}>Continue</button></div></Crd></OV>)}
function YEModal({state,onCont}){const pf=calcPF(state.ar);const savPct=((1-Math.max(0,BASE_E-state.ts-state.obS-state.wS)/BASE_E)*100).toFixed(1);return(<OV><Crd border={CL.gold} bg={"linear-gradient(180deg,"+CL.goldBg+","+CL.cream+")"}><div style={{textAlign:"center"}}><span style={{fontSize:40,display:"block",animation:"diceBounce .6s ease"}}>📅</span><h2 style={{color:CL.brn,fontSize:22,fontFamily:"Georgia,serif"}}>{"Year "+state.year}</h2><p style={{color:CL.brnLt,fontSize:12,marginBottom:10}}>{"New budget: $"+BASE_CAP.toLocaleString()}</p><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:12}}>{[{l:"Retrofits",v:state.ar.length,c:CL.grn},{l:"Savings",v:savPct+"%",c:Number(savPct)>50?CL.grn:CL.gold},{l:"Net Value",v:"$"+pf.net.toFixed(0),c:pf.net>=0?CL.grn:CL.red}].map(function(it){return(<div key={it.l} style={{background:"rgba(255,255,255,.5)",borderRadius:8,padding:6}}><div style={{fontSize:8,color:CL.brnLt,fontWeight:600}}>{it.l}</div><div style={{fontSize:16,fontWeight:800,color:it.c,fontFamily:"Georgia,serif"}}>{it.v}</div></div>)})}</div><button onClick={onCont} style={{padding:"10px 28px",borderRadius:8,border:"none",background:"linear-gradient(135deg,"+CL.gold+",#C49A38)",color:CL.wht,fontWeight:800,cursor:"pointer",fontSize:14}}>Continue</button></div></Crd></OV>)}
function Tut({onClose}){return(<OV><Crd><div style={{maxHeight:"65vh",overflowY:"auto"}}><h2 style={{color:CL.brn,fontSize:18,marginBottom:10,fontFamily:"Georgia,serif"}}>🏠 How to Play</h2>{[{i:"🎲",t:"Roll & Move",d:"Roll TWO dice (2-12) and hop around the board!"},{i:"📅",t:"Year Change",d:"Pass START or NEXT YEAR → new year, $8,000 budget!"},{i:"🃏",t:"Retrofit Cards",d:"Tap to flip. Read the EnergyPlus parameter changes, then decide."},{i:"🤖",t:"AI Teammate",d:"Optionally ask AI — your choice to consult or not!"},{i:"⚡",t:"EnergyPlus",d:"Real building simulation runs each year to calculate energy!"},{i:"👤",t:"OB Cards",d:"Occupant behavior: ➕saves, ➖costs energy."},{i:"🌡️",t:"Weather",d:"Coldwave (-2,000) / Heatwave (-3,000 kWh)."},{i:"🎯",t:"Goal",d:"20 years × $8,000/yr. Cut "+BASE_E.toLocaleString()+"→0 kWh!"}].map(function(it){return(<div key={it.t} style={{display:"flex",gap:8,marginBottom:8}}><span style={{fontSize:16,flexShrink:0}}>{it.i}</span><div><div style={{color:CL.brn,fontWeight:700,fontSize:11,fontFamily:"Georgia,serif"}}>{it.t}</div><div style={{color:CL.brnLt,fontSize:10,lineHeight:1.4}}>{it.d}</div></div></div>)})}</div><button onClick={onClose} style={{width:"100%",padding:10,borderRadius:8,border:"none",background:"linear-gradient(135deg,"+CL.grn+",#3A7A30)",color:CL.wht,fontWeight:800,cursor:"pointer",fontSize:13,marginTop:6}}>Got it!</button></Crd></OV>)}

function Results({state,onReset}){const fe=Math.max(0,BASE_E-state.ts),pct=(1-fe/BASE_E)*100;const inv=state.hist.reduce(function(s,h){return s+h.exp},0)+state.exp;const g=pct>=90?"S":pct>=70?"A":pct>=50?"B":pct>=30?"C":"D";const gc={S:CL.gold,A:CL.grn,B:CL.blu,C:"#D4A843",D:CL.red}[g];const pf=calcPF(state.ar);const aiC=state.dec.filter(function(d){return d.aiConsulted}).length;React.useEffect(function(){sendToSheets({timestamp:new Date().toISOString(),participantId:state.pid,sessionId:state.sid,playerName:state.name,grade:g,energyReductionPct:pct.toFixed(1),totalInvested:inv,portfolioNetValue:pf.net.toFixed(0),totalRetrofits:state.ar.length,retrofitNames:state.ar.map(function(r){return r.name}).join(", "),totalDecisions:state.dec.length,buyCount:state.dec.filter(function(d){return d.action==="buy"}).length,skipCount:state.dec.filter(function(d){return d.action==="skip"}).length,aiAgreement:aiC+"/"+state.dec.length,ppoUsed:ppoLoaded,decisionsJSON:JSON.stringify(state.dec),historyJSON:JSON.stringify(state.hist)})},[]);return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(180deg,"+CL.sage+","+CL.sageDk+")",padding:16}}><div style={{maxWidth:460,width:"100%",animation:"scaleIn .5s ease"}}><div style={{background:CL.cream,borderRadius:18,padding:24,border:"3px solid "+CL.sageDk,textAlign:"center"}}><div style={{fontSize:64,fontWeight:900,color:gc,fontFamily:"Georgia,serif",animation:"diceBounce .6s ease"}}>{g}</div><h1 style={{color:CL.brn,fontSize:22,fontFamily:"Georgia,serif"}}>Game Complete!</h1><p style={{color:CL.brnLt,fontSize:11,marginBottom:4}}>{state.name}</p><div style={{background:CL.grn+"12",borderRadius:10,padding:10,marginBottom:14,border:"1px solid "+CL.grn+"30"}}><div style={{fontSize:10,color:CL.brnLt,fontWeight:600}}>📊 FINAL PORTFOLIO</div><div style={{fontSize:28,fontWeight:900,color:pf.net>=0?CL.grn:CL.red,fontFamily:"Georgia,serif"}}>{"$"+pf.net.toFixed(0)}</div></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:14}}>{[{l:"Savings",v:pct.toFixed(1)+"%",c:gc},{l:"Retrofits",v:state.ar.length,c:CL.grn},{l:"AI Consulted",v:aiC+"/"+state.dec.length,c:CL.blu},{l:"Save $/yr",v:"$"+(state.ts*RATE).toFixed(0),c:CL.blu}].map(function(it){return(<div key={it.l} style={{background:CL.creamDk,borderRadius:8,padding:8}}><div style={{fontSize:8,color:CL.brnLt,fontWeight:600}}>{it.l}</div><div style={{fontSize:16,fontWeight:800,color:it.c,fontFamily:"Georgia,serif"}}>{it.v}</div></div>)})}</div><button onClick={onReset} style={{padding:"12px 40px",borderRadius:10,border:"none",background:"linear-gradient(135deg,"+CL.grn+",#3A7A30)",color:CL.wht,fontWeight:800,cursor:"pointer",fontSize:14}}>Play Again</button></div></div></div>)}

function Menu({onStart,onTut}){const[n,setN]=React.useState("");return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(180deg,"+CL.sage+","+CL.sageDk+",#5A8A4E)",padding:16}}><div style={{textAlign:"center",zIndex:1,animation:"scaleIn .6s ease"}}><div style={{background:CL.cream,borderRadius:22,padding:"28px 32px",maxWidth:360,width:"100%",border:"3px solid "+CL.sageDk,boxShadow:"0 10px 30px rgba(0,0,0,.2)"}}><div style={{fontSize:48,marginBottom:4}}>🏠</div><h1 style={{fontSize:24,fontWeight:900,color:CL.brn,fontFamily:"Georgia,serif",lineHeight:1.2,marginBottom:2}}>NET-ZERO<br/>HOME RACE</h1><p style={{color:CL.brnLt,fontSize:11,marginBottom:16}}>Retrofit your home over 20 years!</p><input value={n} onChange={function(e){setN(e.target.value)}} placeholder="Your name..." style={{width:"100%",padding:"8px 12px",borderRadius:8,boxSizing:"border-box",border:"2px solid "+CL.creamDk,background:CL.wht,color:CL.brn,fontSize:14,textAlign:"center",outline:"none",fontFamily:"Georgia,serif"}} onKeyDown={function(e){if(e.key==="Enter")onStart(n.trim()||"Player")}}/><div style={{display:"flex",gap:8,marginTop:12}}><button onClick={onTut} style={{flex:1,padding:10,borderRadius:8,border:"2px solid "+CL.sageDk,background:"transparent",color:CL.sageDk,fontWeight:700,cursor:"pointer",fontSize:12}}>How to Play</button><button onClick={function(){onStart(n.trim()||"Player")}} style={{flex:1.3,padding:10,borderRadius:8,border:"none",background:"linear-gradient(135deg,"+CL.grn+",#3A7A30)",color:CL.wht,fontWeight:800,fontSize:14,cursor:"pointer"}}>Start Game</button></div></div></div></div>)}

function App(){const[st,dp]=React.useReducer(red,INIT);const animRef=React.useRef(null);const roll=React.useCallback(function(){dp({type:"ROLL"});const v1=Math.floor(Math.random()*6)+1;const v2=Math.floor(Math.random()*6)+1;setTimeout(function(){dp({type:"DICE_SHOW",d1:v1,d2:v2});setTimeout(function(){dp({type:"START_MOVE"})},1000)},1200)},[]);
React.useEffect(function(){if(st.animating&&st.animPos!==st.animTarget){animRef.current=setTimeout(function(){dp({type:"ANIM_STEP"})},500);return function(){clearTimeout(animRef.current)}}else if(st.animating&&st.animPos===st.animTarget){setTimeout(function(){dp({type:"ANIM_DONE"})},600)}},[st.animating,st.animPos,st.animTarget]);
React.useEffect(function(){if(st.phase==="ep_loading"){const names=st.ar.map(function(r){return r.name});if(EP_API_URL){callEPAPI(names,"normal").then(function(result){setTimeout(function(){dp({type:"EP_DONE",result:result})},3000)})}else{setTimeout(function(){dp({type:"EP_DONE",result:null})},2000)}}},[st.phase]);
const handleAskAI=React.useCallback(async function(){let ppoResult=null;if(ppoLoaded){ppoResult=await ppoPredict({year:st.year,pos:st.pos,capital:st.capital,ts:st.ts,ar:st.ar},st.curSp)}dp({type:"ASK_AI",ppoResult:ppoResult})},[st.year,st.pos,st.capital,st.ts,st.ar,st.curSp]);

if(st.phase==="over")return <Results state={st} onReset={function(){dp({type:"RESET"})}}/>;
if(st.phase==="menu")return(<div><Menu onStart={function(name){dp({type:"START",name:name})}} onTut={function(){dp({type:"TUT"})}}/>{st.tut&&<Tut onClose={function(){dp({type:"TUT"})}}/>}</div>);

const canRoll=st.phase==="playing"&&!st.rolling&&!st.animating;const av=st.capital-utilB(st)-st.exp;const displayPos=st.animating?st.animPos:st.pos;const statusText=canRoll?"🎲 Tap dice to roll!":st.diceAnim?"Rolling...":st.diceShowResult?"Rolled "+st.dv+"!":st.animating?"Moving...":"Waiting...";
return(<div style={{minHeight:"100vh",background:"linear-gradient(180deg,"+CL.sage+","+CL.sageDk+")",fontFamily:"'Segoe UI',system-ui,sans-serif"}}><div style={{padding:"6px 12px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(0,0,0,.08)",borderBottom:"1px solid rgba(0,0,0,.06)"}}><span style={{fontWeight:800,fontSize:12,color:CL.wht,fontFamily:"Georgia,serif"}}>🏠 NZHR</span><span style={{fontSize:10,color:"rgba(255,255,255,.7)"}}>{st.name+" · Year "+st.year}{ppoLoaded&&<span style={{marginLeft:4,padding:"1px 5px",borderRadius:4,background:CL.blu,color:CL.wht,fontSize:8}}>PPO</span>}</span><button onClick={function(){dp({type:"TUT"})}} style={{background:"rgba(255,255,255,.15)",border:"none",color:CL.wht,padding:"3px 10px",borderRadius:5,cursor:"pointer",fontSize:11}}>?</button></div><div style={{maxWidth:500,margin:"0 auto",padding:"6px 8px 80px"}}><Stats st={st}/><div style={{marginBottom:8}}><RectBoard displayPos={displayPos} targetPos={st.animTarget} ar={st.ar} animating={st.animating}/></div><div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:14,marginBottom:8,minHeight:90}}><AnimDice diceAnim={st.diceAnim} diceShowResult={st.diceShowResult} d1={st.d1} d2={st.d2} value={st.dv} onRoll={roll} disabled={!canRoll}/><div style={{textAlign:"left"}}><div style={{fontSize:12,color:CL.cream,fontWeight:700}}>{statusText}</div><div style={{fontSize:9,color:"rgba(255,255,255,.5)"}}>{"Pos "+st.pos+": "+B[st.pos].n}</div>{st.animating&&<div style={{fontSize:10,color:CL.gold,fontWeight:600,marginTop:3}}>{"🚶 Step "+((st.animPos-st.pos+24)%24||"...")+" of "+st.dv}</div>}</div></div><OwnedRetrofits ar={st.ar} selected={st.selRetrofit} onSelect={function(n){dp({type:"SEL_RETRO",name:n})}}/><Log log={st.log}/></div>{st.phase==="ep_loading"&&<EPLoadingModal year={st.year}/>}{st.phase==="retrofit_choice"&&st.curSp&&<RetrofitModal space={st.curSp} cardStage={st.cardStage} advice={st.ai} ok={av>=st.curSp.c} onFlip={function(){dp({type:"FLIP_CARD"})}} onAskAI={handleAskAI} onBuy={function(c){dp({type:"BUY",consulted:c})}} onSkip={function(c){dp({type:"SKIP",consulted:c})}}/>}{st.phase==="ob"&&st.curOB&&<OBModal card={st.curOB} onDismiss={function(){dp({type:"DOB"})}}/>}{st.phase==="weather"&&st.curW&&<WModal type={st.curW} onDismiss={function(){dp({type:"DW"})}}/>}{st.phase==="year_end"&&<YEModal state={st} onCont={function(){dp({type:"DYE"})}}/>}{st.tut&&<Tut onClose={function(){dp({type:"TUT"})}}/>}</div>)}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
